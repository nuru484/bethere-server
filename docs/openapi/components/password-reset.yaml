schemas:
  PasswordResetToken:
    type: string
    minLength: 64
    maxLength: 64
    description: |
      The raw reset token, 32 random bytes rendered as 64 hex characters. It is
      never stored: only its SHA-256 digest is kept, so a leaked database dump
      cannot be replayed against this endpoint. The one place the raw value
      exists is the link in the reset email.

      Validation checks the length and nothing else, so a 64-character value
      that was never issued is not a validation failure: it simply fails the
      digest lookup and comes back as the same generic 400 as an expired or
      already-used token.
    examples: ['9f2c4b7e1a6d5038c1b94ea27f60d3815c4a9b0e6d2f7381a5c0e94b26d7f138']

  PasswordResetRequest:
    type: object
    description: |
      Names the account to send a reset link to. Nothing else is accepted: the
      caller cannot influence the link, the recipient address, or the lifetime.
    required: [email]
    properties:
      email:
        type: string
        format: email
        description: |
          Resolved against administrators first, then attendants, so both
          principal types reset through this one endpoint. Normalized before
          lookup, so casing and provider-specific address forms do not decide
          whether a real account is found.
        examples: [amina@example.com]

  PasswordResetVerifyRequest:
    type: object
    description: |
      Checks a token before showing the new-password form. The token is sent in
      the body rather than the query string so it never reaches an access log,
      a proxy log, or a `Referer` header on the way to the server.
    required: [token]
    properties:
      token: { $ref: '#/components/schemas/PasswordResetToken' }

  PasswordResetVerifyResponse:
    type: object
    description: |
      Confirms the token is still usable and returns just enough to address the
      user on the reset screen. Verifying does not consume the token, so the
      form can be opened, abandoned, and reopened until it expires.
    required: [message, data]
    properties:
      message:
        type: string
        examples: [Token is valid. You can proceed to reset your password.]
      data:
        type: object
        required: [email, firstName]
        properties:
          email:
            type: string
            format: email
            description: |
              The account the link belongs to, shown so the user can see which
              address they are resetting. Only ever disclosed to a holder of a
              valid, unexpired token.
            examples: [amina@example.com]
          firstName:
            type: string
            examples: [Amina]

  PasswordResetConfirmRequest:
    type: object
    description: |
      Completes the reset. The confirmation field is checked twice, once by
      request validation and once again in the service, so the rule holds even
      if this endpoint is ever called from somewhere that skips the validators.
    required: [token, newPassword, confirmPassword]
    properties:
      token: { $ref: '#/components/schemas/PasswordResetToken' }
      newPassword:
        type: string
        format: password
        minLength: 8
        maxLength: 255
        description: |
          Must contain an uppercase letter, a lowercase letter, and a digit.
          This is the same policy object used by registration and by the
          change-password route, so no surface can drift into being weaker.
          Never trimmed or escaped: sanitizing would alter the credential
          before it is hashed.
        examples: [NewPassw0rd!]
      confirmPassword:
        type: string
        format: password
        description: Must equal `newPassword` exactly.
        examples: [NewPassw0rd!]
