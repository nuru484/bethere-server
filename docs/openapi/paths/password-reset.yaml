/api/v1/password-reset/request:
  post:
    tags: [Password reset]
    operationId: requestPasswordReset
    summary: Request a password reset link
    description: |
      Step one. Resolves the email against administrators first, then
      attendants, and emails that account a link containing a single-use token
      that is valid for 15 minutes.

      The response is byte-identical whether or not the address belongs to an
      account, so this endpoint cannot be used to discover who is registered.
      That guarantee is about timing as well as content: the email is dispatched
      off the response path, because awaiting SMTP for a known address made it
      measurably slower than the unknown-address case and re-opened enumeration
      by stopwatch. A failed send is logged and still answers 200, since telling
      the caller that delivery failed would leak the same fact.

      Issuing a new link invalidates any still-active link for that account, so
      only the most recent email in an inbox works.

      Rate limited to 5 requests per 15 minutes. The limiter fails closed: if
      the rate-limit store is unreachable the request is rejected rather than
      allowed, so an infrastructure outage cannot become a mailbombing window.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PasswordResetRequest' }
    responses:
      '200':
        description: |
          Accepted. A link was sent if, and only if, an account exists for that
          address. The body says nothing either way.
        headers:
          X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageResponse' }
            example:
              message: If an account exists with this email, you will receive a password reset link shortly.
      '400': { $ref: '#/components/responses/ValidationError' }
      '429': { $ref: '#/components/responses/RateLimited' }

/api/v1/password-reset/verify-reset-token:
  post:
    tags: [Password reset]
    operationId: verifyPasswordResetToken
    summary: Check a reset token before showing the form
    description: |
      Step two, and optional. The reset page calls this on load so a dead link
      shows an error immediately instead of after the user has typed a new
      password twice.

      Verifying does not consume the token. Only the final reset marks it used,
      so a user can open the link, get interrupted, and come back to the same
      form while it is still inside its 15-minute window.

      The token is sent in the request body rather than the query string. It
      arrives from the email as a query parameter, and the client is expected to
      move it into a POST body precisely so the secret is not written into
      server access logs or forwarded in a `Referer` header.

      Rate limited to 10 attempts per 15 minutes, failing closed, which is what
      makes guessing a 256-bit token pointless in practice as well as in theory.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PasswordResetVerifyRequest' }
    responses:
      '200':
        description: The token is valid and unconsumed.
        headers:
          X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetVerifyResponse' }
            example:
              message: Token is valid. You can proceed to reset your password.
              data:
                email: amina@example.com
                firstName: Amina
      '400':
        description: |
          Either the body failed validation, or the token is not usable. The
          second case is deliberately one indistinguishable answer for unknown,
          already-used, expired, and orphaned-account tokens: telling them apart
          would turn this endpoint into an oracle. Distinguish the two cases by
          `code`, which is `VALIDATION_ERROR` only for the former.
        headers:
          X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example:
              status: error
              message: Invalid or expired password reset link. Please request a new one.
              requestId: 3f1c9d2e-5b7a-4c11-9f60-2a8e4d0b7c31
      '429': { $ref: '#/components/responses/RateLimited' }

/api/v1/password-reset:
  post:
    tags: [Password reset]
    operationId: confirmPasswordReset
    summary: Set a new password with a reset token
    description: |
      Final step. Sets the new password, consumes the token, and voids every
      other outstanding reset token for that account, all in one transaction, so
      a partial failure cannot leave a live token behind a changed password.

      A reset means the previous credential is suspect, so every session for the
      account is revoked afterwards. Access and refresh tokens issued before the
      reset stop working immediately, on every device, rather than lingering
      until they expire.

      The new password may not be the account's current one. Accounts with no
      password at all, which is how administrator-created attendants start,
      skip that check because they are setting a first password rather than
      changing one.

      A rejected attempt does not consume the token: a weak password or a
      mismatched confirmation can be corrected and resubmitted with the same
      link. A successful one does, so replaying it returns the generic 400.

      Rate limited to 10 attempts per 15 minutes, failing closed, sharing the
      same limiter as token verification.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
    responses:
      '200':
        description: |
          Password changed and the token consumed. No session is created here:
          the client is expected to send the user to the login screen, which is
          also where the just-revoked sessions land.
        headers:
          X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageResponse' }
            example:
              message: Password reset successful. You can now log in with your new password.
      '400':
        description: |
          Three different causes share this status. `code` is `VALIDATION_ERROR`
          when the body failed validation, which covers a password that misses
          the length, uppercase, lowercase, or digit rule and a
          `confirmPassword` that does not match. Otherwise the message
          distinguishes an unusable token, which is reported generically, from
          a new password identical to the current one, which is safe to state
          plainly because the caller already holds a valid token for that
          account.
        headers:
          X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example:
              status: error
              message: New password must be different from your current password.
              requestId: 3f1c9d2e-5b7a-4c11-9f60-2a8e4d0b7c31
      '429': { $ref: '#/components/responses/RateLimited' }
