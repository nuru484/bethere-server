    description: Production
  - url: http://localhost:8080
    description: Local development

# Every operation requires a session cookie unless it overrides this with
# `security: []` (public) or names the hand-off scheme (phone pairing).
security:
  - sessionCookie: []

tags:
  - name: Health
    description: Liveness and readiness probes. Unauthenticated, and outside the versioned API.
  - name: Auth
    description: |
      Login, logout, and session lifecycle. Supports password login, one-time
      code login with no password at all, and optional two-factor.
  - name: Password reset
    description: |
      Emailed, time-limited reset links. Request responses are deliberately
      identical whether or not the account exists, so the endpoint cannot be
      used to enumerate registered contacts.
  - name: Users
    description: Attendant accounts. Administrators manage the roster; attendants manage their own profile.
  - name: Admins
    description: Administrator accounts. Administrator-only throughout.
  - name: Events
    description: |
      Events, their venues, and the rotating on-site codes an attendant scans
      to prove they are at the location.
  - name: Attendance
    description: |
      Check-in and check-out. The step endpoints drive the guided
      one-action-at-a-time capture flow; the single-shot endpoints take all
      liveness frames in one request.
  - name: Face scan
    description: |
      Biometric enrollment. Descriptors are stored encrypted, consent is
      versioned and recorded, and raw frames are never persisted.
  - name: Pairing
    description: |
      Hand-off from a laptop to a phone, so a user on a device without a usable
      camera can complete the face check on their phone. The laptop endpoints
      use the session cookie; the phone endpoints use a scoped hand-off token.
  - name: Dashboard
    description: Aggregated analytics. Separate attendant-scoped and administrator-scoped slices.
  - name: Reports
    description: Filtered attendance reporting, including a spreadsheet export.
  - name: Review
    description: |
      The integrity trail: audit logs and the anomalies raised by duplicate
      descriptors, failed liveness, suspected replays, and rapid retries.
